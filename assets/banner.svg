<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="PILOTDREDD — independent software studio">
  <title>PILOTDREDD — independent software studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#1d6fe0" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#0e3c84" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#05070b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#5cc8ff"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1f5fbf"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fb4d6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="380" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1280" height="380" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="14" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="380" rx="14" fill="url(#glow)"/>

  <!-- Mark: layered chevrons -->
  <g transform="translate(1004 190)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-120 -96 L0 0 L-120 96" stroke="#2f81f7" stroke-opacity="0.18" stroke-width="22"/>
    <path d="M-60 -96 L60 0 L-60 96" stroke="#2f81f7" stroke-opacity="0.38" stroke-width="22"/>
    <path d="M0 -96 L120 0 L0 96" stroke="url(#mark)" stroke-width="22"/>
    <circle cx="120" cy="0" r="5" fill="#cfefff" stroke="none"/>
  </g>
  <g stroke="#5cc8ff" stroke-opacity="0.35" stroke-width="1">
    <path d="M1124 190 H1236"/>
    <path d="M884 94 H760"/>
    <path d="M884 286 H760"/>
  </g>
  <g fill="#5cc8ff" fill-opacity="0.6">
    <circle cx="1236" cy="190" r="2.5"/>
    <circle cx="760" cy="94" r="2.5"/>
    <circle cx="760" cy="286" r="2.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI Variable Display','Segoe UI','Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif">
    <text x="84" y="126" fill="#5cc8ff" font-size="20" font-weight="600" letter-spacing="7">INDEPENDENT SOFTWARE STUDIO</text>
    <text x="80" y="222" fill="#f0f4fa" font-size="96" font-weight="700" letter-spacing="4">PILOTDREDD</text>
    <rect x="84" y="250" width="112" height="4" rx="2" fill="url(#accent)"/>
    <text x="84" y="300" fill="#9aa7b8" font-size="27" font-weight="400" letter-spacing="0.5">Windows apps · iOS tooling · Linux automation</text>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="379" rx="14" fill="none" stroke="#30363d" stroke-opacity="0.9"/>
</svg>
